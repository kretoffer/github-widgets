[project]
name = "github-widgets"
version = "0.1.0"
description = "Dynamic SVG roadmap widget for GitHub issues. Sorted by status and priority. Embed in any README"
readme = "README.md"
authors = [
    { name = "Kretov Artem", email = "20kretovartem000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
github-widgets = "main:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = "src"}
