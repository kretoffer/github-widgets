<style>
        .issue {
            padding: 5px 8px;
            margin: 4px;
            border-radius: 14px;
            border: 2.5px solid {{ primary_color }};
        }
        
        .issue-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .status-icon {
            height: 16px;
            border-radius: 10px;
            padding: 5px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            flex-shrink: 0;
        }
        
        .status-open {
            background-color: #28a745;
        }
        
        .status-closed {
            background-color: #cb2431;
        }
        
        .issue-number {
            font-size: 15px;
            font-weight: 600;
            color: {{ primary_color }};
        }
        
        .issue-title {
            font-size: 16px;
            color: {{ primary_color }};
            line-height: 1.4;
        }
        
        .labels {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        
        .label {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
      </style>
      {% for issue in issues %}
      <div class="issue">
          <div class="issue-header">
              <div class="status-icon {% if issue.state == 'open' %}status-open{% else %}status-closed{% endif %}">
                  {% if issue.state == "open" %}open{% else %}close{% endif %}
              </div>
              <span class="issue-number">#{{ issue.number }}</span>
              <div class="issue-title">
                  {{ issue.title }}
              </div>
          </div>
          
          {% if issue.labels %}
          <div class="labels">
              {% for label in issue.labels %}
              <span class="label" 
                    style="color: {{ label.color|color_hex }}; border: 2px solid {{ label.color|color_hex }}; background-color: {{ label.color|color_hex }}40;">
                  {{ label.name }}
              </span>
              {% endfor %}
          </div>
          {% endif %}
      </div>
      {% endfor %}