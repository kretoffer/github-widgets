<style>
	.compact-columns {
		display: flex;
		justify-content: space-between;
		gap: 18px;
		padding-top: 8px;
	}

	.compact-column {
		flex: 1;
		min-width: 0;
		display: flex;
		flex-direction: column;
		gap: 10px;
	}

	.compact-row {
		display: flex;
		align-items: center;
		gap: 8px;
		font-size: {{ fonts.small }}px;
		min-width: 0;
	}

	.compact-dot {
		width: 12px;
		height: 12px;
		border-radius: 4px;
		flex-shrink: 0;
		border: 2px solid {{ colors.border }};
	}

	.compact-name {
		color: {{ colors.text }};
		font-weight: 500;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		flex: 1;
	}

	.compact-percent {
		color: {{ colors.secondary }};
		font-weight: 600;
		white-space: nowrap;
		padding-left: 8px;
	}
</style>

{% if animation_duration > 0 %}
<style>
	@keyframes compact-appear {
		from {
			opacity: 0;
			transform: translateX(12px);
		}
		to {
			opacity: 1;
			transform: translateX(0);
		}
	}
</style>
{% endif %}

{% set ns = namespace(index=0) %}
<div class="compact-columns">
	{% for column in column_groups %}
	<div class="compact-column">
		{% for item in column %}
		<div class="compact-row" {% if animation_duration > 0 %}style="animation: compact-appear {{ animation_duration }}s ease both; animation-delay: {{ ns.index * animation_duration }}s;"{% endif %}>
			<span class="compact-dot" style="background-color: {{ item.color }};"></span>
			<span class="compact-name">{{ item.name }}</span>
			{% if show_percent %}
			<span class="compact-percent">{{ item.share }}%</span>
			{% endif %}
		</div>
		{% set ns.index = ns.index + 1 %}
		{% endfor %}
	</div>
	{% endfor %}
</div>