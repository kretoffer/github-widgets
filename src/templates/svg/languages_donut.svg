<style>
	.chart-layout {
		display: flex;
		align-items: center;
		gap: 16px;
		padding-top: 8px;
	}

	.pie-svg {
		width: {{ pie_size }}px;
		height: {{ pie_size }}px;
		flex-shrink: 0;
	}

	.pie-slices {
		width: 100%;
		height: 100%;
	}

	.donut-center {
		font-size: {{ fonts.big }}px;
		font-weight: 600;
		fill: {{ colors.text }};
		text-anchor: middle;
		dominant-baseline: central;
	}

	.legend {
		display: flex;
		flex-direction: column;
		gap: 6px;
		min-width: 0;
		flex: 1;
	}

	.legend-row {
		display: flex;
		align-items: center;
		gap: 8px;
		font-size: {{ fonts.small }}px;
		min-width: 0;
	}

	.legend-dot {
		width: 12px;
		height: 12px;
		border-radius: 4px;
		flex-shrink: 0;
		border: 2px solid {{ colors.border }};
	}

	.legend-name {
		color: {{ colors.text }};
		font-weight: 500;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.legend-percent {
		margin-left: auto;
		color: {{ colors.secondary }};
		font-weight: 600;
		white-space: nowrap;
		padding-left: 8px;
	}
</style>

{% if animation_duration > 0 %}
<style>
	@keyframes slice-appear {
		from {
			opacity: 0;
			transform: scale(0.7);
		}
		to {
			opacity: 1;
			transform: scale(1);
		}
	}
</style>
{% endif %}

{% set ns = namespace(index=0) %}
{% set ln = namespace(index=0) %}
<div class="chart-layout">
	<svg class="pie-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{ pie_size }} {{ pie_size }}">
		<g {% if animation_duration > 0 %}style="animation: slice-appear {{ animation_duration }}s ease both;"{% endif %}>
			{% for slice in slices %}
			<path d="{{ slice.d }}" fill="{{ slice.color }}" stroke="{{ colors.border }}" stroke-width="1"></path>
			{% endfor %}
			{% if donut_center %}
			<text class="donut-center" x="{{ pie_center }}" y="{{ pie_center }}">{{ donut_center }}</text>
			{% endif %}
		</g>
	</svg>
	<div class="legend">
		{% for slice in slices %}
		<div class="legend-row" {% if animation_duration > 0 %}style="animation: slice-appear {{ animation_duration }}s ease both; animation-delay: {{ ln.index * animation_duration }}s;"{% endif %}>
			<span class="legend-dot" style="background-color: {{ slice.color }};"></span>
			<span class="legend-name">{{ slice.name }}</span>
			{% if show_percent %}
			<span class="legend-percent">{{ slice.share }}%</span>
			{% endif %}
		</div>
		{% set ln.index = ln.index + 1 %}
		{% endfor %}
	</div>
</div>