<style>
	.inline-block {
		display: flex;
		flex-direction: column;
		gap: 8px;
		padding-top: 8px;
	}

	.lang-bar {
		display: flex;
		width: 100%;
		height: 10px;
		border-radius: 5px;
		overflow: hidden;
		border: 1px solid {{ colors.border }};
	}

	.lang-bar-seg {
		height: 100%;
		flex-shrink: 0;
	}

	.chips {
		display: flex;
		flex-wrap: wrap;
		column-gap: 16px;
		row-gap: 6px;
		align-items: center;
	}

	.chip {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		font-size: {{ fonts.small }}px;
		color: {{ colors.secondary }};
		white-space: nowrap;
	}

	.chip-dot {
		width: 12px;
		height: 12px;
		border-radius: 4px;
		flex-shrink: 0;
		border: 2px solid {{ colors.border }};
	}

	.chip-name {
		color: {{ colors.text }};
		font-weight: 500;
	}

	.chip-percent {
		font-weight: 600;
		color: {{ colors.secondary }};
	}
</style>

{% if animation_duration > 0 %}
<style>
	@keyframes rise {
		from {
			opacity: 0;
			transform: translateY(32px);
		}
		to {
			opacity: 1;
			transform: translateY(0);
		}
	}
</style>
{% endif %}

{% set ns = namespace(index=0) %}
<div class="inline-block">
	<div class="lang-bar" {% if animation_duration > 0 %}style="animation: rise {{ animation_duration }}s ease both;"{% endif %}>
		{% for segment in segments %}
		<div class="lang-bar-seg" style="width: {{ segment.width }}%; background-color: {{ segment.color }};"></div>
		{% endfor %}
	</div>
	<div class="chips">
		{% for chip in chips %}
		<span class="chip" {% if animation_duration > 0 %}style="animation: rise {{ animation_duration }}s ease both; animation-delay: {{ ns.index * animation_duration }}s;"{% endif %}>
			<span class="chip-dot" style="background-color: {{ chip.color }};"></span>
			<span class="chip-name">{{ chip.name }}</span>
			{% if show_percent %}
			<span class="chip-percent">{{ chip.share }}%</span>
			{% endif %}
		</span>
		{% set ns.index = ns.index + 1 %}
		{% endfor %}
	</div>
</div>