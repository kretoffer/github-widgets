<style>
	.repo-card {
		display: flex;
		flex-direction: column;
		gap: 6px;
		padding: 20px 12px 4px 12px;
		border: 2.5px solid {{ colors.border }};
		border-radius: 14px;
		margin: 10px 0 0 0;
	}

	.repo-name {
		font-size: {{ fonts.big }}px;
		font-weight: 600;
		color: {{ colors.primary }};
		line-height: 1.3;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.repo-description {
		font-size: {{ fonts.medium }}px;
		color: {{ colors.text }};
		line-height: 1.4;
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: {{ description_lines }};
		overflow: hidden;
	}

	.repo-metrics {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 18px;
		font-size: {{ fonts.medium }}px;
		font-weight: 600;
		color: {{ colors.text }};
	}

	.metric {
		display: flex;
		align-items: center;
		gap: 5px;
		flex-shrink: 0;
		color: {{ colors.secondary }};
	}

	.metric-icon {
		width: 16px;
		height: 16px;
		flex-shrink: 0;
	}

	.star-icon {
		width: 15px;
		height: 15px;
		flex-shrink: 0;
	}
</style>

{% for repo in repos %}
<div class="repo-card">
	<div class="repo-name">{{ repo.full_name }}</div>

	{% if repo.description %}
	<div class="repo-description">{{ repo.description }}</div>
	{% endif %}

	<div class="repo-metrics">
		<div class="repo-metrics">
			{% if show_stars %}
			<span class="metric">
				<svg class="star-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
					<path fill="{{ colors.secondary }}" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
				</svg>
				{{ repo.stars }}
			</span>
			{% endif %}
			{% if show_forks %}
			<span class="metric">
				<svg class="metric-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
					<path fill="{{ colors.secondary }}" d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/>
				</svg>
				{{ repo.forks }}
			</span>
			{% endif %}
		</div>
		{% if repo.license %}
		<span class="metric">
			<svg class="metric-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
				<path fill="{{ colors.secondary }}" d="M8.75.75V2h.985c.304 0 .603.08.867.231l1.29.736c.038.022.08.033.124.033h2.234a.75.75 0 0 1 0 1.5h-.427l2.111 4.692a.75.75 0 0 1-.154.838l-.53-.53.529.531-.001.002-.002.002-.006.006-.006.005-.01.01-.045.04c-.21.176-.441.327-.686.45C14.556 10.78 13.88 11 13 11a4.498 4.498 0 0 1-2.023-.454 3.544 3.544 0 0 1-.686-.45l-.045-.04-.016-.015-.006-.006-.004-.004v-.001a.75.75 0 0 1-.154-.838L12.178 4.5h-.162c-.305 0-.604-.079-.868-.231l-1.29-.736a.245.245 0 0 0-.124-.033H8.75V13h2.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1 0-1.5h2.5V3.5h-.984a.245.245 0 0 0-.124.033l-1.289.737c-.265.15-.564.23-.869.23h-.162l2.112 4.692a.75.75 0 0 1-.154.838l-.53-.53.529.531-.001.002-.002.002-.006.006-.016.015-.045.04c-.21.176-.441.327-.686.45C4.556 10.78 3.88 11 3 11a4.498 4.498 0 0 1-2.023-.454 3.544 3.544 0 0 1-.686-.45l-.045-.04-.016-.015-.006-.006-.004-.004v-.001a.75.75 0 0 1-.154-.838L2.178 4.5H1.75a.75.75 0 0 1 0-1.5h2.234a.249.249 0 0 0 .125-.033l1.288-.737c.265-.15.564-.23.869-.23h.984V.75a.75.75 0 0 1 1.5 0Zm2.945 8.477c.285.135.718.273 1.305.273s1.02-.138 1.305-.273L13 6.327Zm-10 0c.285.135.718.273 1.305.273s1.02-.138 1.305-.273L3 6.327Z"/>
			</svg>
			{{ repo.license }}
		</span>
		{% endif %}
		{% if repo.language %}
		<span class="metric">
			<span style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; background-color: {{ repo.language|text2color }}; flex-shrink: 0; border: 2px solid {{ colors.border }};"></span>
			{{ repo.language }}
		</span>
		{% endif %}
	</div>
</div>
{% endfor %}
